name: Build and Release Discord RPC Plugin (Legacy)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 9
        
    - name: Install frontend dependencies
      run: pnpm install
      
    - name: Build frontend
      run: pnpm run build
      
    - name: Create plugin package
      run: |
        mkdir -p release/discord-rpc
        cp -r dist release/discord-rpc/
        cp main.py release/discord-rpc/
        cp plugin.json release/discord-rpc/
        cp package.json release/discord-rpc/
        cp README.md release/discord-rpc/
        cp LICENSE release/discord-rpc/
        cp -r assets release/discord-rpc/ 2>/dev/null || true
        cp -r defaults release/discord-rpc/ 2>/dev/null || true
        cp -r py_modules release/discord-rpc/ 2>/dev/null || true
        
    - name: Get version from tag
      id: get_version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(jq -r '.version' package.json)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"
        
    - name: Create release zip
      run: |
        cd release
        zip -r discord-rpc-plugin-${{ steps.get_version.outputs.version }}.zip discord-rpc/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: discord-rpc-plugin-${{ steps.get_version.outputs.version }}
        path: release/discord-rpc-plugin-${{ steps.get_version.outputs.version }}.zip
        
    - name: Upload to release (if tagged)
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/discord-rpc-plugin-${{ steps.get_version.outputs.version }}.zip