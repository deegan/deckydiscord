name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 9
        
    - name: Install frontend dependencies
      run: pnpm install
      
    - name: Build frontend
      run: pnpm run build
      
    - name: Create plugin package
      run: |
        mkdir -p release/discord-rpc
        cp -r dist release/discord-rpc/
        cp main.py release/discord-rpc/
        cp plugin.json release/discord-rpc/
        cp package.json release/discord-rpc/
        cp requirements.txt release/discord-rpc/
        cp README.md release/discord-rpc/
        cp LICENSE release/discord-rpc/
        cp -r assets release/discord-rpc/ 2>/dev/null || true
        cp -r defaults release/discord-rpc/ 2>/dev/null || true
        cp -r py_modules release/discord-rpc/ 2>/dev/null || true
        
    - name: Create release zip
      run: |
        cd release
        zip -r discord-rpc-plugin.zip discord-rpc/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: discord-rpc-plugin
        path: release/discord-rpc-plugin.zip
        
    - name: Upload to release (if tagged)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: release/discord-rpc-plugin.zip